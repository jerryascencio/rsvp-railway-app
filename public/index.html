<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP Search</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 20px; line-height: 1.5; }
    input, select, textarea, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; font-size: 16px; box-sizing: border-box; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .result { border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin-top: 12px; }
    .muted { color: #666; }
    .hidden { display: none; }
    .radio-row { display: flex; gap: 20px; margin: 12px 0 16px; }
    .radio-row label { display: flex; align-items: center; gap: 8px; }
    .radio-row input { width: auto; margin: 0; }
    .success { color: green; font-weight: bold; }
    .error { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RSVP Search</h1>
    <p class="muted">Search by first name, last name, or phone number.</p>

    <label for="first">First name</label>
    <input id="first" value="Maria" />

    <label for="last">Last name</label>
    <input id="last" value="Lopez" />

    <label for="phone">Phone number</label>
    <input id="phone" value="8185550101" />

    <button id="searchBtn" type="button">Find my RSVP</button>

    <div id="status" class="muted"></div>
    <div id="results"></div>
  </div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const results = document.getElementById('results');
    const status = document.getElementById('status');

    async function runSearch() {
      const first = document.getElementById('first').value.trim();
      const last = document.getElementById('last').value.trim();
      const phone = document.getElementById('phone').value.trim();

      const params = new URLSearchParams();
      if (first) params.set('first', first);
      if (last) params.set('last', last);
      if (phone) params.set('phone', phone);

      status.textContent = 'Searching...';
      results.innerHTML = '';

      try {
        const res = await fetch('/api/guests?' + params.toString());
        const guests = await res.json();

        if (!Array.isArray(guests) || guests.length === 0) {
          status.textContent = 'No matches found.';
          return;
        }

        const g = guests[0];
        status.textContent = 'Guest found.';

        let options = '';
        for (let i = 1; i <= g.invites; i++) {
          options += `<option value="${i}">${i}</option>`;
        }

        results.innerHTML = `
          <div class="result">
            <h3>${g.name}</h3>
            <p><strong>Total invited:</strong> ${g.invites}</p>
            <p><strong>Phone:</strong> ${g.phone || ''}</p>

            <hr style="margin:16px 0;" />

            <p><strong>Will you be attending?</strong></p>
            <div class="radio-row">
              <label><input type="radio" name="attending" value="yes"> Yes</label>
              <label><input type="radio" name="attending" value="no"> No</label>
            </div>

            <div id="guestCountWrap" class="hidden">
              <label for="guestCount"><strong>How many will attend?</strong></label>
              <select id="guestCount">${options}</select>
            </div>

            <label for="note">Note (optional)</label>
            <textarea id="note" rows="3" placeholder="Dietary restrictions, message, etc."></textarea>

            <button id="submitRsvpBtn" type="button">Submit RSVP</button>
            <div id="submitMsg" class="muted"></div>
          </div>
        `;

        const radios = document.querySelectorAll('input[name="attending"]');
        const guestCountWrap = document.getElementById('guestCountWrap');
        const submitBtn = document.getElementById('submitRsvpBtn');
        const submitMsg = document.getElementById('submitMsg');

        radios.forEach(radio => {
          radio.addEventListener('change', () => {
            const checked = document.querySelector('input[name="attending"]:checked');
            guestCountWrap.classList.toggle('hidden', !checked || checked.value !== 'yes');
          });
        });

        submitBtn.addEventListener('click', async () => {
          const selected = document.querySelector('input[name="attending"]:checked');
          const note = document.getElementById('note').value.trim();

          if (!selected) {
            submitMsg.className = 'error';
            submitMsg.textContent = 'Please choose Yes or No.';
            return;
          }

          const payload = {
            attending: selected.value,
            attendees: selected.value === 'yes' ? Number(document.getElementById('guestCount').value) : 0,
            note
          };

          submitMsg.className = 'muted';
          submitMsg.textContent = 'Submitting RSVP...';

          try {
            const res = await fetch('/api/rsvp/' + g.id, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (!res.ok) {
              submitMsg.className = 'error';
              submitMsg.textContent = data.error || 'Failed to submit RSVP.';
              return;
            }

            submitMsg.className = 'success';
            submitMsg.textContent = 'Thank you! Your RSVP has been submitted.';
          } catch (err) {
            submitMsg.className = 'error';
            submitMsg.textContent = 'Network error. Please try again.';
          }
        });
      } catch (err) {
        status.textContent = 'Search failed.';
        results.innerHTML = '<div class="result">There was an error loading guest results.</div>';
      }
    }

    searchBtn.addEventListener('click', runSearch);
  </script>
</body>
</html>
